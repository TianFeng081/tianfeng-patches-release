name: Publish dev.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev13.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated dev.13 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-550c-81f5-b369-92fca706a095/raw?se=2026-09-06T11%3A45%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=70fe220d-2557-5f93-af4f-3b6b5c6a8d67&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T00%3A14%3A59Z&ske=2026-09-07T00%3A14%3A59Z&sks=b&skv=2026-02-06&sig=kidrPDW2hIT68MHLWzlDmjVL7GttTdrQHZnyydf5hgU%3D' -o artifact.zip
          unzip -o artifact.zip
          test "$(stat -c %s patches-0.0.1-dev.13.mpp)" = "103248"
          echo 'e68510c5986cf35e54dcd139f919e3ae01b69f6288262943fef1cb59e3b5f5dc  patches-0.0.1-dev.13.mpp' | sha256sum -c -

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.0.1-dev.13 patches-0.0.1-dev.13.mpp \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.13' \
            --notes 'Development prerelease 0.0.1-dev.13. Fixes NetShort 2.2.9 startup crashes caused by two corrupt Force member state replacements in the offline VIP coroutine. Inspection of a real patched APK showed the old hard-coded indices replaced cmp-long and Long.<init>(J), producing invalid bytecode that can fail ART verification. Those offline replacements are removed. Pairip signature compatibility remains enabled; Google Play Licensing and server authorization remain unchanged.'

      - name: Update main metadata
        run: |
          cat > patches-bundle.json <<'EOF'
          {
            "created_at": "2026-09-06T11:40:10",
            "description": "TianFeng Patches 0.0.1-dev.13 development prerelease. Fixes NetShort 2.2.9 startup crashes by removing two corrupt hard-coded offline VIP instruction replacements discovered in a real patched APK.",
            "download_url": "https://github.com/TianFeng081/tianfeng-patches-release/releases/download/v0.0.1-dev.13/patches-0.0.1-dev.13.mpp",
            "signature_download_url": "",
            "version": "0.0.1-dev.13"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches-bundle.json
          git commit -m 'release: point main metadata to dev.13'
          git push origin HEAD:main
          cp patches-bundle.json /tmp/patches-bundle.json

      - name: Update dev metadata
        run: |
          git fetch origin dev
          git switch dev
          cp /tmp/patches-bundle.json patches-bundle.json
          git add patches-bundle.json
          git commit -m 'release: point dev metadata to dev.13'
          git push origin HEAD:dev
