name: Build and Release MPP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  packages: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Morphe patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon --stacktrace

      - name: Verify bundle
        run: |
          curl -L --fail --retry 3 \
            -o morphe-desktop.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v1.14.0/morphe-desktop-1.14.0-all.jar
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -type f | head -n 1)"
          test -n "$MPP"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/java" -jar morphe-desktop.jar list-patches \
            --patches "$MPP" \
            --with-packages \
            --with-versions > morphe-patches-list.txt
          cat morphe-patches-list.txt
          grep -F 'Specific | YouTube Music CAR | Certificate compatibility' morphe-patches-list.txt
          grep -F 'Specific | YouTube Music CAR | Browse and search' morphe-patches-list.txt
          grep -F 'Specific | YouTube Music CAR | Android Auto projection discovery' morphe-patches-list.txt
          grep -F 'Specific | YouTube Music CAR | Full Android Auto app-side features' morphe-patches-list.txt
          grep -F 'com.google.android.apps.youtube.music' morphe-patches-list.txt
          grep -F '9.34.22' morphe-patches-list.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          TAG="v${VERSION}"
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -type f | head -n 1)"
          test -n "$VERSION"
          test -n "$MPP"
          ASSET="tianfeng-patches-${VERSION}.mpp"
          cp "$MPP" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "TianFeng Patches ${TAG}" \
              --notes "Morphe patch bundle with app-specific and universal patch categories. Version ${VERSION} currently includes app-specific YouTube Music CAR_RELEASE Android Auto patches."
          fi
