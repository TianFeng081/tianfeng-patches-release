name: Publish dev.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev10.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated dev.10 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-f6d8-81fa-8ea1-d5b54ade2788/raw?se=2026-09-06T10%3A23%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=2596b5dc-3c9a-586f-8968-77311173057c&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T02%3A01%3A41Z&ske=2026-09-07T02%3A01%3A41Z&sks=b&skv=2026-02-06&sig=Mc8VBSM4T1pwlrJzk21hCSCXq0eddpUdiXNrBfrcDc4%3D' -o artifact.zip
          unzip -o artifact.zip
          test "$(stat -c %s patches-0.0.1-dev.10.mpp)" = "99656"
          echo 'c92ca1bd0e5f7136f06bc2386f7bc69920219ba359e771299ba8bf96f0b822da  patches-0.0.1-dev.10.mpp' | sha256sum -c -

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.0.1-dev.10 patches-0.0.1-dev.10.mpp \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.10' \
            --notes 'Development prerelease 0.0.1-dev.10. Fixes NetShort 2.2.9 Force member state on Morphe Patcher 1.12.0 by removing replaceInstruction-based smali compilation and using compatible field writes instead.'

      - name: Update main metadata
        run: |
          cat > patches-bundle.json <<'EOF'
          {
            "created_at": "2026-09-06T10:18:45",
            "description": "TianFeng Patches 0.0.1-dev.10 development prerelease. Fixes NetShort 2.2.9 Force member state compatibility with Morphe Patcher 1.12.0 by removing replaceInstruction-based smali compilation.",
            "download_url": "https://github.com/TianFeng081/tianfeng-patches-release/releases/download/v0.0.1-dev.10/patches-0.0.1-dev.10.mpp",
            "signature_download_url": "",
            "version": "0.0.1-dev.10"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches-bundle.json
          git commit -m 'release: point main metadata to dev.10'
          git push origin HEAD:main
          cp patches-bundle.json /tmp/patches-bundle.json

      - name: Update dev metadata
        run: |
          git fetch origin dev
          git switch dev
          cp /tmp/patches-bundle.json patches-bundle.json
          git add patches-bundle.json
          git commit -m 'release: point dev metadata to dev.10'
          git push origin HEAD:dev
