name: Publish dev.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev9.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated dev.9 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-e758-8209-b959-976a3ad8cb21/raw?se=2026-09-06T10%3A02%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=b7eaefae-daf5-54d5-8cd9-d58e6ba64e7f&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T03%3A12%3A32Z&ske=2026-09-07T03%3A12%3A32Z&sks=b&skv=2026-02-06&sig=%2BCCK80ScNwgENRAGk0JaPmUYI8J0XcRThVTmAHD98zk%3D' -o artifact.zip
          unzip -o artifact.zip
          test "$(stat -c %s patches-0.0.1-dev.9.mpp)" = "99678"
          echo '41643300224ffb5af388cb5d0faf6f3895004817d2f1f867db0f5ec433e9dd1d  patches-0.0.1-dev.9.mpp' | sha256sum -c -

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.0.1-dev.9 patches-0.0.1-dev.9.mpp \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.9' \
            --notes 'Development prerelease 0.0.1-dev.9. Fixes custom source metadata timestamp compatibility and aligns NetShort patch names with the existing TianFeng style: Hide ads, Force member state, Unlock member UI, Hide purchase prompts, and Simulate coin unlock success. Existing YouTube Music Android Auto and Truecaller patches remain included.'

      - name: Update main metadata
        run: |
          cat > patches-bundle.json <<'EOF'
          {
            "created_at": "2026-09-06T09:56:35",
            "description": "TianFeng Patches 0.0.1-dev.9 development prerelease. Fixes Morphe custom source metadata timestamp compatibility and aligns NetShort 2.2.9 patch names with the existing project style.",
            "download_url": "https://github.com/TianFeng081/tianfeng-patches-release/releases/download/v0.0.1-dev.9/patches-0.0.1-dev.9.mpp",
            "signature_download_url": "",
            "version": "0.0.1-dev.9"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches-bundle.json
          git commit -m 'release: point main metadata to dev.9'
          git push origin HEAD:main
          cp patches-bundle.json /tmp/patches-bundle.json

      - name: Update dev metadata
        run: |
          git fetch origin dev
          git switch dev
          cp /tmp/patches-bundle.json patches-bundle.json
          git add patches-bundle.json
          git commit -m 'release: point dev metadata to dev.9'
          git push origin HEAD:dev
