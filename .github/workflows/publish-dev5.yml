name: Publish dev.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-dev5.yml'
      - 'release-assets/dev5/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify chunks and rebuild artifact
        run: |
          cat > chunks.sha256 <<'EOF'
          7fde0b889d2a52279c9b1f19507988626c684dce07be9488c9f000a8236576ff  release-assets/dev5/part-00.b64
          7d8cf4c37ec86205eb990415485fb93dc692b5f999f7f151c767d7a7aa2b7558  release-assets/dev5/part-01.b64
          0218d9430d688f907f2c52608c6a9430e4cc2bfaa14ae19263b9a189bd6bf27d  release-assets/dev5/part-02.b64
          b69d4e9ea99582203a153a7bd171301a3b5b055df04cf0c8b7a8f2982ebf634f  release-assets/dev5/part-03.b64
          7d4fe53104948821790649ca7eff89349152c7eb55255cefe03a7132ce5952e3  release-assets/dev5/part-04.b64
          e5372447a7fba2cc7179260897fcf517152c82df61a39236ffccdc9bd1a7d331  release-assets/dev5/part-05.b64
          936f1b74f52f180b91412d7af00981800d26479a0563715a853d375a8cccfc2b  release-assets/dev5/part-06.b64
          51707f8ba785a9195a606871f4d77d1598bd2d81dc8c0ff57c19b8279ada291d  release-assets/dev5/part-07.b64
          61b4b562fce8527583d4eebdfead849788998fc7c563fbb62bb6d72960f29f38  release-assets/dev5/part-08.b64
          EOF
          sha256sum -c chunks.sha256
          cat release-assets/dev5/part-*.b64 | base64 -d > patches-0.0.1-dev.5.mpp
          echo '3323ac44be91ceb7fc670da6844abe4409b992e486541c301c62b07d0a027cb6  patches-0.0.1-dev.5.mpp' | sha256sum -c -

      - name: Replace prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: TianFeng081/tianfeng-patches-release
        run: |
          gh release delete v0.0.1-dev.4 --yes --cleanup-tag || true
          gh release create v0.0.1-dev.5 patches-0.0.1-dev.5.mpp \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.5' \
            --notes 'Development prerelease for YouTube Music 9.34.52. Replaces CAR_RELEASE manifest-based Android Auto logic with the MediaBrowser search unlock targeting ytm_media_browser/search_media_items. Includes Enable Android Auto MediaBrowser search and Enable Android Auto features. Keep Morphe Bypass certificate checks selected. Truecaller patches remain included.'
