name: Publish dev.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-dev4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated artifact
        run: |
          curl -L --fail --retry 3 -o artifact.zip 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-7cc8-81fd-91c9-233486b541dc/raw?se=2026-09-05T10%3A25%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=b7b8b0e0-79fb-5949-a738-71432b80158e&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T04%3A34%3A07Z&ske=2026-09-06T04%3A34%3A07Z&sks=b&skv=2026-02-06&sig=RQ9n1CIC7te0Jsrpu1QvN4X5Y8iuTKw6SNc%2BDatlFcA%3D'
          unzip -q artifact.zip
          test -f patches-0.0.1-dev.4.mpp
          echo 'c36625bc4005eeccdc70260e4c660c36087c401afb2170755dcb4db368fc3b38  patches-0.0.1-dev.4.mpp' | sha256sum -c -

      - name: Replace prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: TianFeng081/tianfeng-patches-release
        run: |
          gh release delete v0.0.1-dev.3 --yes --cleanup-tag || true
          gh release create v0.0.1-dev.4 patches-0.0.1-dev.4.mpp \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.4' \
            --notes 'Development prerelease. Adds Enable Android Auto media browser for YouTube Music 9.34.22 CAR_RELEASE by ensuring the existing MediaBrowserService is enabled and exported. Existing browse/search and projection patches remain included; certificate bypass remains provided by Morphe original patches.'
