name: Publish dev.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-dev2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated artifact
        run: |
          curl -L --fail --retry 3 -o artifact.zip 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-8328-820b-bbbc-711718234b65/raw?se=2026-09-05T10%3A07%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=66a71766-30ea-5361-92e7-e466393c2a6e&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A13%3A31Z&ske=2026-09-05T23%3A13%3A31Z&sks=b&skv=2026-02-06&sig=lwVJe7mqh5iPunb42f6RzJaM4TvSGOdPLgCB2OxgxXM%3D'
          unzip -q artifact.zip
          test -f patches-0.0.1-dev.2.mpp
          echo '856d9d5faac772e5ffd9de5b5ae9e36007bc448e901d4cd7064652ce2041a584  patches-0.0.1-dev.2.mpp' | sha256sum -c -

      - name: Replace prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: TianFeng081/tianfeng-patches-release
        run: |
          gh release delete v0.0.1-dev.1 --yes --cleanup-tag || true
          gh release create v0.0.1-dev.2 patches-0.0.1-dev.2.mpp \
            --target 4c31d57c4584badc2096ec56939e7c8e2a80293f \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.2' \
            --notes 'Development prerelease. Renames patches to Morphe-style action names and labels the compatible app as YouTube Music (CAR_RELEASE). Android Auto browse/search and projection behavior is unchanged; certificate bypass remains provided by Morphe original patches.'
