name: Publish dev.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev12.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated dev.12 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-0e08-81f7-a977-ce4ff52d3246/raw?se=2026-09-06T11%3A16%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=44f34212-1fd6-58ab-8974-7b0dad6ee175&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T02%3A02%3A52Z&ske=2026-09-07T02%3A02%3A52Z&sks=b&skv=2026-02-06&sig=0Q3INCJPZDmskiG6a6CfOTpvSNPsEEDV8AJrLk3M/gc%3D' -o artifact.zip
          unzip -o artifact.zip
          test "$(stat -c %s patches-0.0.1-dev.12.mpp)" = "104473"
          echo '432ad5b039fbdab65f51720388b5fad81f96f4ec549ca605b26dbe199cf9ff20  patches-0.0.1-dev.12.mpp' | sha256sum -c -

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.0.1-dev.12 patches-0.0.1-dev.12.mpp \
            --prerelease \
            --title 'TianFeng Patches v0.0.1-dev.12' \
            --notes 'Development prerelease 0.0.1-dev.12. Adds NetShort 2.2.9 Signature compatibility based on Morphe certificate-compatibility patterns. It bypasses only Pairip local APK signature verification so re-signed patched APKs are not rejected. Google Play Licensing, signed license responses, server membership, purchases, and playback authorization remain unchanged.'

      - name: Update main metadata
        run: |
          cat > patches-bundle.json <<'EOF'
          {
            "created_at": "2026-09-06T11:11:38",
            "description": "TianFeng Patches 0.0.1-dev.12 development prerelease. Adds NetShort 2.2.9 Signature compatibility for Pairip local APK signature verification while leaving Google Play Licensing and server authorization unchanged.",
            "download_url": "https://github.com/TianFeng081/tianfeng-patches-release/releases/download/v0.0.1-dev.12/patches-0.0.1-dev.12.mpp",
            "signature_download_url": "",
            "version": "0.0.1-dev.12"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches-bundle.json
          git commit -m 'release: point main metadata to dev.12'
          git push origin HEAD:main
          cp patches-bundle.json /tmp/patches-bundle.json

      - name: Update dev metadata
        run: |
          git fetch origin dev
          git switch dev
          cp /tmp/patches-bundle.json patches-bundle.json
          git add patches-bundle.json
          git commit -m 'release: point dev metadata to dev.12'
          git push origin HEAD:dev
